name: site

on:
  push:
    branches: [main]
    paths: [site/**, get.sh, docs/images/icon.png, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site serves the installer itself, so the short command always matches get.sh in main.
      - name: Assemble
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp get.sh _site/install.sh
          cp docs/images/icon.png _site/icon.png
          echo pluglight.onelenyk.dev > _site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
