name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI and run tests
        run: make test

      - name: Build app
        run: make app

      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent "PlugLight.app" PlugLight.zip
          shasum -a 256 PlugLight.zip > PlugLight.zip.sha256
          cat PlugLight.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PlugLight
          path: |
            build/PlugLight.zip
            build/PlugLight.zip.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/PlugLight.zip build/PlugLight.zip.sha256 \
            --title "PlugLight $GITHUB_REF_NAME" --notes-file docs/release-notes.md
